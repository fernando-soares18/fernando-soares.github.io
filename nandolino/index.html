<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nandolino | Assistente de Fernando Soares</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121a22;
    --line: #26313d;
    --text: #f3f7fb;
    --muted: #98a6b5;
    --green: #38d477;
    --green-soft: rgba(56, 212, 119, .10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;
    background: radial-gradient(circle at 80% 10%, rgba(56,212,119,.08), transparent 30%), var(--bg);
    color: var(--text);
    font-family: 'Josefin Sans', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }
  .app {
    width: min(100%, 460px);
    height: 100%;
    min-height: 0;
    max-height: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.4);
    display: flex;
    flex-direction: column;
  }
  .header {
    flex: 0 0 auto;
    padding: 16px 24px 12px;
    text-align: center;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(56,212,119,.06), transparent);
  }
  .avatar-wrap { display: flex; justify-content: center; margin-bottom: 6px; }
  .avatar-wrap svg { width: 84px; height: 84px; filter: drop-shadow(0 10px 20px rgba(0,0,0,.4)); }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.3rem; }
  h1 span { color: var(--green); }
  .status { color: var(--muted); font-size: .8rem; margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(56,212,119,.12); }
  .key-settings {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    font-size: .72rem; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-family: inherit;
  }
  .key-settings:hover { border-color: var(--green); color: var(--green); }
  .key-settings.active { border-color: var(--green); color: var(--green); }
  .header-buttons { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }

  .chat { flex: 1 1 0; min-height: 0; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: .92rem; line-height: 1.5; }
  .msg.bot { align-self: flex-start; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: var(--green); color: #07110b; font-weight: 600; border-bottom-right-radius: 4px; }

  .input-row { flex: 0 0 auto; display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); }
  .input-row input {
    flex: 1;
    min-width: 0;
    background: rgba(255,255,255,.03);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: .95rem;
  }
  .input-row input:focus { outline: none; border-color: var(--green); }
  .input-row button {
    background: var(--green);
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-weight: 700;
    color: #07110b;
    cursor: pointer;
    font-family: inherit;
  }
  .input-row button:hover { background: #49e58a; }
  #micBtn {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 12px; padding: 0 12px; cursor: pointer; font-size: 1rem;
  }
  #micBtn:hover { border-color: var(--green); color: var(--green); }
  #micBtn.recording { border-color: #ff5c5c; color: #ff5c5c; animation: pulseMic 1s infinite; }
  #voiceBtn.muted { opacity: .4; }
  @keyframes pulseMic { 0%,100% { box-shadow: 0 0 0 0 rgba(255,92,92,.35); } 50% { box-shadow: 0 0 0 6px rgba(255,92,92,0); } }

  /* Blink */
  .eye-lid { transform-origin: center; transform-box: fill-box; transform: scaleY(0); opacity: 0; animation: blink 5s ease-in-out infinite; }
  .eye-lid.right { animation-delay: .08s; }
  @keyframes blink { 0%,86%,100% { transform: scaleY(0); opacity: 0; } 90% { transform: scaleY(1); opacity: 1; } 94% { transform: scaleY(0); opacity: 0; } }

  /* Mouth talking state */
  .mouth-idle { display: block; }
  .mouth-talk { display: none; transform-origin: center; transform-box: fill-box; }
  .talking .mouth-idle { display: none; }
  .talking .mouth-talk { display: block; animation: talk .35s ease-in-out infinite; }
  @keyframes talk { 0%, 100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }


  .quick-wrap { flex: 0 0 auto; padding: 0 16px 12px; }
  .quick-label { color: var(--muted); font-size: .72rem; margin: 0 0 8px 2px; }
  .quick-actions { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
  .quick-action { flex: 0 0 auto; border: 1px solid var(--line); background: rgba(255,255,255,.025); color: #dce5ed; border-radius: 999px; padding: 7px 10px; font: 600 .73rem 'Josefin Sans', Arial, sans-serif; cursor: pointer; }
  .quick-action:hover, .quick-action:focus-visible { border-color: var(--green); color: var(--green); outline: none; }
  .msg a { color: var(--green); font-weight: 700; text-decoration: none; }
  .msg a:hover { text-decoration: underline; }
  .msg .msg-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .msg .msg-action { display: inline-flex; align-items: center; justify-content: center; padding: 7px 10px; border-radius: 9px; background: var(--green); color: #07110b; font-size: .78rem; font-weight: 700; text-decoration: none; }
  .msg .msg-action.secondary { background: transparent; color: var(--green); border: 1px solid rgba(56,212,119,.45); }
  .typing { display: inline-flex; gap: 4px; align-items: center; min-height: 18px; }
  .typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: typingDot 1s infinite ease-in-out; }
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes typingDot { 0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1} }
  @media (max-width: 390px) { .header { padding-inline: 16px; } .chat { padding-inline: 14px; } .input-row { padding-inline: 12px; gap: 7px; } .input-row button { padding-inline: 14px; } }

  .status.thinking .dot { background: #f4c15d; box-shadow: 0 0 0 4px rgba(244,193,93,.12); }
  .status.online .dot { background: var(--green); box-shadow: 0 0 0 4px rgba(56,212,119,.12); }
  .status.local .dot { background: #8fa0b2; box-shadow: 0 0 0 4px rgba(143,160,178,.10); }
  .status.error .dot { background: #ff7777; box-shadow: 0 0 0 4px rgba(255,119,119,.10); }
  .msg { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg .msg-actions { white-space: normal; }
  .input-row input:disabled, .input-row button:disabled { opacity: .58; cursor: wait; }
  @media (max-height: 600px) {
    .header { padding: 8px 16px 6px; }
    .avatar-wrap { margin-bottom: 2px; }
    .avatar-wrap svg { width: 52px; height: 52px; }
    h1 { font-size: 1.1rem; }
    .header-buttons { margin-top: 4px; }
    .chat { padding: 8px 12px; gap: 8px; }
    .quick-wrap { padding: 0 12px 6px; }
    .quick-label { margin-bottom: 4px; }
    .quick-action { padding: 5px 8px; }
    .input-row { padding: 8px 10px; gap: 6px; }
    .input-row input { padding: 10px; }
    .input-row button { padding-inline: 12px; }
    #micBtn { padding-inline: 8px; }
  }
</style>
<script src="config.js"></script>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="avatar-wrap">
        <svg id="nandolino" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="skin" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#e0a878"/>
              <stop offset="60%" stop-color="#c98f61"/>
              <stop offset="100%" stop-color="#9c6a41"/>
            </radialGradient>
            <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#3a4650"/>
              <stop offset="100%" stop-color="#20272d"/>
            </linearGradient>
          </defs>

          <!-- Ombros/camisa -->
          <path d="M30 200 Q100 150 170 200 L170 220 L30 220 Z" fill="url(#shirt)"/>

          <!-- Pescoço -->
          <rect x="82" y="120" width="36" height="30" fill="#b57e54"/>

          <!-- Cabeça careca -->
          <ellipse cx="100" cy="90" rx="52" ry="58" fill="url(#skin)"/>

          <!-- Brilho da careca -->
          <ellipse cx="82" cy="55" rx="20" ry="14" fill="#ffffff" opacity="0.12"/>

          <!-- Orelhas -->
          <ellipse cx="46" cy="95" rx="8" ry="12" fill="#c98f61"/>
          <ellipse cx="154" cy="95" rx="8" ry="12" fill="#c98f61"/>

          <!-- Sobrancelhas -->
          <path d="M68 78 Q80 70 92 76" fill="none" stroke="#3a2415" stroke-width="4" stroke-linecap="round"/>
          <path d="M108 76 Q120 70 132 78" fill="none" stroke="#3a2415" stroke-width="4" stroke-linecap="round"/>

          <!-- Olhos -->
          <g>
            <ellipse cx="80" cy="92" rx="9" ry="10" fill="#2a1a10"/>
            <circle cx="82" cy="89" r="3" fill="white" opacity="0.8"/>
            <ellipse class="eye-lid left" cx="80" cy="92" rx="9" ry="10" fill="#c98f61"/>
          </g>
          <g>
            <ellipse cx="120" cy="92" rx="9" ry="10" fill="#2a1a10"/>
            <circle cx="122" cy="89" r="3" fill="white" opacity="0.8"/>
            <ellipse class="eye-lid right" cx="120" cy="92" rx="9" ry="10" fill="#c98f61"/>
          </g>

          <!-- Nariz -->
          <path d="M96 100 Q92 112 100 116 Q108 112 104 100" fill="none" stroke="#7a4f30" stroke-width="2.5" stroke-linecap="round"/>

          <!-- Barba leve -->
          <path d="M62 108 Q100 138 138 108 Q136 130 100 136 Q64 130 62 108Z" fill="#241812" opacity="0.35"/>

          <!-- Boca parada -->
          <path class="mouth-idle" d="M84 122 Q100 128 116 122" fill="none" stroke="#5a3520" stroke-width="3" stroke-linecap="round"/>
          <!-- Boca falando (alternável via JS) -->
          <ellipse class="mouth-talk" cx="100" cy="123" rx="12" ry="6" fill="#5a3520"/>
        </svg>
      </div>
      <h1>Nandolino <span>IA</span></h1>
      <p class="status" id="aiStatus"><span class="dot" id="aiDot"></span><span id="aiStatusText">assistente de Fernando Soares</span></p>
      <div class="header-buttons">
        <button class="key-settings" type="button" id="voiceBtn" title="Ativar/desativar voz do Nandolino">🔊 Voz</button>
      </div>
    </div>

    <div class="chat" id="chat" aria-live="polite"></div>

    <div class="quick-wrap" id="quickWrap">
      <p class="quick-label">Você pode começar por aqui:</p>
      <div class="quick-actions" id="quickActions"></div>
    </div>

    <div class="input-row">
      <button id="micBtn" type="button" title="Falar com o Nandolino">🎤</button>
      <input type="text" id="userInput" placeholder="Digite sua pergunta..." autocomplete="off" maxlength="600" aria-label="Pergunta para o Nandolino">
      <button id="sendBtn" type="button">Enviar</button>
    </div>
  </div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const nandolino = document.getElementById('nandolino');
const quickActions = document.getElementById('quickActions');
const aiStatus = document.getElementById('aiStatus');
const aiStatusText = document.getElementById('aiStatusText');
const micBtn = document.getElementById('micBtn');

const LINKS = {
  portfolio: '../index.html#projetos',
  drCharles: 'https://drcharlesgenehr.com.br',
  github: 'https://github.com/fernando-soares18',
  linkedin: 'https://www.linkedin.com/in/fernando-soares-da-rosa-programador519994931555',
  whatsapp: 'https://wa.me/5551999493155'
};



/* Nandolino 2.1 — ponte segura para n8n + Ollama via Cloudflare Tunnel.
   Configure apenas a URL pública do webhook. Nenhuma chave privada deve ficar aqui. */
const REMOTE_CONFIG = window.NANDOLINO_CONFIG || {};
const NANDOLINO_AI = {
  enabled: REMOTE_CONFIG.enabled !== false,
  endpoint: String(REMOTE_CONFIG.endpoint || '').trim(),
  timeoutMs: Number(REMOTE_CONFIG.timeoutMs) > 0 ? Number(REMOTE_CONFIG.timeoutMs) : 120000,
  visitorId: localStorage.getItem('nandolino_visitor_id') || (() => {
    const id = (crypto.randomUUID ? crypto.randomUUID() : 'visitor-' + Date.now() + '-' + Math.random().toString(16).slice(2));
    localStorage.setItem('nandolino_visitor_id', id); return id;
  })()
};

function setAIStatus(state, label) {
  aiStatus.classList.remove('thinking', 'online', 'local', 'error');
  if (state) aiStatus.classList.add(state);
  aiStatusText.textContent = label;
}

function safeActionHref(value) {
  const href = String(value || '').trim();
  if (!href) return null;
  if (/^https:\/\//i.test(href) || /^(\.\.?\/|#)/.test(href)) return href;
  return null;
}

async function askRemoteAI(message) {
  if (!NANDOLINO_AI.enabled || !NANDOLINO_AI.endpoint) {
    setAIStatus('local', 'modo local • IA externa não configurada');
    return null;
  }

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), NANDOLINO_AI.timeoutMs);
  setAIStatus('thinking', 'Nandolino está pensando…');

  try {
    const response = await fetch(NANDOLINO_AI.endpoint, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        message: String(message).slice(0, 600),
        sessionId: NANDOLINO_AI.visitorId,
        source: 'portfolio',
        language: 'pt-BR',
        page: location.href
      }),
      signal: controller.signal
    });

    if (!response.ok) throw new Error('HTTP ' + response.status);
    const type = response.headers.get('content-type') || '';
    const data = type.includes('application/json') ? await response.json() : { reply: await response.text() };
    const text = data.reply || data.answer || data.output || data.message;
    if (!text || typeof text !== 'string') throw new Error('Resposta inválida');

    setAIStatus('online', 'IA local online • n8n + Ollama');
    return { text, actions: Array.isArray(data.actions) ? data.actions : [] };
  } catch (err) {
    const timedOut = err && err.name === 'AbortError';
    setAIStatus('local', timedOut ? 'IA demorou • usando respostas locais' : 'IA offline • usando respostas locais');
    console.warn('Nandolino AI indisponível; usando modo local.', err);
    return null;
  } finally {
    clearTimeout(timer);
  }
}

const QUICK = [
  ['Conheça Fernando', 'Quem é o Fernando?'],
  ['Projetos', 'Quais são os projetos do Fernando?'],
  ['Tecnologias', 'Quais tecnologias o Fernando usa?'],
  ['Projeto Dr. Charles', 'Me conte sobre o projeto do Dr. Charles'],
  ['Por que contratar?', 'Por que eu deveria contratar o Fernando?'],
  ['Como você funciona?', 'Como o Nandolino funciona?']
];

let lastTopic = 'geral';

function normalizeText(text) {
  return text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();
}


function whatsappUrl(topic = lastTopic) {
  const messages = {
    charles: 'Olá, Fernando! Vi seu portfólio e conversei com o Nandolino sobre o projeto do Dr. Charles. Gostaria de falar sobre um projeto parecido.',
    projetos: 'Olá, Fernando! Vi seus projetos no portfólio e gostaria de conversar sobre um site para mim/meu negócio.',
    tecnologias: 'Olá, Fernando! Vi seu portfólio e gostaria de conversar sobre uma oportunidade de desenvolvimento Front-end.',
    contratar: 'Olá, Fernando! Vi seu portfólio, conversei com o Nandolino e tenho interesse em contratar seu trabalho.',
    geral: 'Olá, Fernando! Vi seu portfólio e conversei com o Nandolino. Gostaria de falar sobre um projeto.'
  };
  return LINKS.whatsapp + '?text=' + encodeURIComponent(messages[topic] || messages.geral);
}

function addMessage(content, who = 'bot', actions = []) {
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = content;
  if (who !== 'user') {
    if (actions.length) {
      const row = document.createElement('div');
      row.className = 'msg-actions';
      actions.forEach(action => {
        const href = safeActionHref(action && action.href);
        if (!href) return;
        const a = document.createElement('a');
        a.className = 'msg-action' + (action.secondary ? ' secondary' : '');
        a.href = href;
        a.textContent = String(action.label || 'Abrir');
        if (/^https:\/\//i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; }
        a.addEventListener('click', () => {
          try {
            const isWhats = /wa\.me|whatsapp/i.test(href);
            const isProject = /drcharles|netlify|calculadora|#projetos/i.test(href);
            if (isWhats || isProject) {
              parent.postMessage({
                type: 'portfolio-analytics',
                event: isWhats ? 'whatsapp_click' : 'project_click',
                meta: { label: action.label, source: 'nandolino' }
              }, '*');
            }
          } catch (_) {}
        });
        row.appendChild(a);
      });
      div.appendChild(row);
    }
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typing';
  div.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function renderQuickActions() {
  quickActions.innerHTML = '';
  QUICK.forEach(([label, question]) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'quick-action';
    btn.textContent = label;
    btn.addEventListener('click', () => ask(question));
    quickActions.appendChild(btn);
  });
}

function answerFor(question) {
  const q = normalizeText(question);
  const wantsMore = /outro|outros|mais projeto|mais projetos|continua|continuar/.test(q);

  if (/quem e|conhecer|conheca|sobre fernando|fala do fernando|nome completo/.test(q)) {
    lastTopic = 'geral';
    return {
      text: 'Fernando Soares é desenvolvedor Front-end de Novo Hamburgo/RS, com foco em criar sites responsivos, claros e profissionais. Ele trabalha com projetos próprios e já entregou um site completo para cliente real. Quer ver o projeto profissional ou conhecer as tecnologias que ele usa?',
      actions: [{label:'Ver projetos', href:LINKS.portfolio, secondary:true}]
    };
  }

  if (/charles|medico|dermatolog/.test(q)) {
    lastTopic = 'charles';
    return {
      text: 'O site do Dr. Charles Genehr é o principal projeto profissional do portfólio. Fernando trabalhou na estrutura institucional, artigos, eBooks, painel administrativo, integração com WhatsApp, responsividade, publicação e ajustes de hospedagem. Posso te mostrar outros projetos também.',
      actions: [
        {label:'Abrir site do Dr. Charles', href:LINKS.drCharles},
        {label:'Falar com Fernando', href:whatsappUrl('charles'), secondary:true}
      ]
    };
  }

  if (/projeto|portfolio|trabalho|site que fez|sites que fez/.test(q) || wantsMore) {
    lastTopic = 'projetos';
    return {
      text: 'Os destaques são o site profissional do Dr. Charles Genehr, o Netflix Clone, um Cronômetro e uma Calculadora Interativa. Cada um mostra uma habilidade diferente: projeto real, responsividade, lógica, interação e acabamento visual.',
      actions: [
        {label:'Ver seção de projetos', href:LINKS.portfolio},
        {label:'Conversar sobre um projeto', href:whatsappUrl('projetos'), secondary:true}
      ]
    };
  }

  if (/nandolino|como voce funciona|ia local|ollama|n8n|cloudflare|skynet/.test(q)) {
    lastTopic = 'tecnologias';
    return {
      text: 'O próprio Nandolino é um projeto do Fernando: a interface roda no portfólio, envia a pergunta por webhook ao n8n, o AI Agent usa um modelo Qwen local pelo Ollama e a resposta volta pela internet através de um Cloudflare Tunnel. Se a IA local estiver desligada, eu continuo com um modo de respostas locais.',
      actions: [{label:'Ver GitHub', href:LINKS.github, secondary:true}]
    };
  }

  if (/tecnologia|stack|linguagem|html|css|javascript|php|git|github|ferramenta/.test(q)) {
    lastTopic = 'tecnologias';
    return {
      text: 'Fernando trabalha com HTML5, CSS3 e JavaScript, além de Git/GitHub, PHP básico, deploy web e integrações com n8n, Ollama e webhooks. O foco é unir interface responsiva com automação e funcionalidades reais.',
      actions: [{label:'Ver GitHub', href:LINKS.github, secondary:true}]
    };
  }

  if (/por que contratar|porque contratar|contratar|diferencial|vale a pena|o que entrega/.test(q)) {
    lastTopic = 'contratar';
    return {
      text: 'Porque ele não fica só no visual: acompanha estrutura, responsividade, conteúdo, publicação e os ajustes necessários para colocar o site no ar. O projeto do Dr. Charles mostra essa capacidade de levar um trabalho real do desenvolvimento à entrega.',
      actions: [{label:'Falar com Fernando no WhatsApp', href:whatsappUrl('contratar')}]
    };
  }

  if (/formacao|curso|estudou|dev club/.test(q)) {
    lastTopic = 'geral';
    return { text: 'Fernando estuda desenvolvimento Front-end com apoio do Dev Club e segue evoluindo com prática constante em projetos próprios e trabalhos reais.' };
  }

  if (/experiencia|experiencia profissional|atua|tempo|desde quando/.test(q)) {
    lastTopic = 'geral';
    return { text: 'Fernando vem construindo experiência em desenvolvimento Front-end por meio de estudos, projetos próprios e uma entrega profissional completa para cliente, com publicação, manutenção e necessidades reais de negócio.' };
  }

  if (/disponivel|freelance|vaga|oportunidade|emprego/.test(q)) {
    lastTopic = 'contratar';
    return { text: 'Sim. Fernando está disponível para novos projetos e oportunidades em Front-end.', actions:[{label:'Falar com Fernando', href:whatsappUrl('contratar')}] };
  }

  if (/contato|whatsapp|falar com|chamar|orcamento|preco|valor/.test(q)) {
    lastTopic = lastTopic || 'geral';
    return { text: 'O jeito mais rápido é pelo WhatsApp. Já deixei uma mensagem pronta dizendo que você veio pelo portfólio e conversou comigo.', actions:[{label:'Abrir WhatsApp', href:whatsappUrl(lastTopic)}] };
  }

  if (/linkedin/.test(q)) return { text:'Você pode conhecer mais do perfil profissional do Fernando pelo LinkedIn.', actions:[{label:'Abrir LinkedIn', href:LINKS.linkedin, secondary:true}] };
  if (/github/.test(q)) return { text:'No GitHub estão os códigos e estudos do Fernando.', actions:[{label:'Abrir GitHub', href:LINKS.github, secondary:true}] };
  if (/oi|ola|bom dia|boa tarde|boa noite|e ai|fala/.test(q)) return { text:'Oi! Eu sou o Nandolino, guia do portfólio do Fernando. Posso te mostrar quem ele é, os projetos, tecnologias ou te levar direto ao contato.' };

  return {
    text: 'Consigo te ajudar melhor com informações sobre o Fernando e o trabalho dele. Escolhe um dos atalhos abaixo ou pergunta sobre projetos, tecnologias, experiência, disponibilidade ou contato.'
  };
}

let busy = false;
function setBusy(on) {
  busy = on;
  input.disabled = false;
  sendBtn.disabled = on;
  if (micBtn) micBtn.disabled = on;
  sendBtn.textContent = on ? 'Pensando…' : 'Enviar';
}

async function ask(forcedText) {
  if (busy) return;
  const text = String(forcedText || input.value).trim().slice(0, 600);
  if (!text) return;

  unlockVoice();
  addMessage(text, 'user');
  input.value = '';
  nandolino.classList.add('talking');
  const typing = showTyping();
  setBusy(true);

  try {
    const remoteAnswer = await askRemoteAI(text);
    const answer = remoteAnswer || answerFor(text);
    typing.remove();
    addMessage(answer.text, 'bot', answer.actions || []);
    speak(answer.text);
  } catch (err) {
    typing.remove();
    setAIStatus('error', 'erro temporário • tente novamente');
    addMessage('Tive um problema para responder agora. Tente novamente em alguns segundos.', 'bot');
    console.error(err);
  } finally {
    setBusy(false);
    if (!input.disabled) input.focus();
  }
}

/* Voz: Nandolino falando (Text-to-Speech) */
let voiceUnlocked = false;
function unlockVoice() {
  if (voiceUnlocked || !('speechSynthesis' in window)) return;
  voiceUnlocked = true;
  const silence = new SpeechSynthesisUtterance(' ');
  silence.volume = 0;
  speechSynthesis.speak(silence);
}
function isVoiceEnabled() { return localStorage.getItem('nandolino_voice_muted') !== '1'; }
function speak(text) {
  nandolino.classList.remove('talking');
  if (!isVoiceEnabled() || !('speechSynthesis' in window)) return;
  const clean = text.replace(/https?:\/\/\S+/g, '').replace(/[*_#]/g, '').replace(/\s{2,}/g, ' ').trim();
  const utter = new SpeechSynthesisUtterance(clean);
  utter.lang = 'pt-BR';
  utter.rate = 1;
  const voices = speechSynthesis.getVoices();
  const ptVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('pt'));
  if (ptVoice) utter.voice = ptVoice;
  utter.onstart = () => nandolino.classList.add('talking');
  utter.onend = () => nandolino.classList.remove('talking');
  utter.onerror = () => nandolino.classList.remove('talking');
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

const voiceBtn = document.getElementById('voiceBtn');
function updateVoiceButton() {
  voiceBtn.classList.toggle('muted', !isVoiceEnabled());
  voiceBtn.textContent = isVoiceEnabled() ? '🔊 Voz' : '🔇 Voz';
}
voiceBtn.addEventListener('click', () => {
  const muted = localStorage.getItem('nandolino_voice_muted') === '1';
  if (muted) localStorage.removeItem('nandolino_voice_muted');
  else { speechSynthesis.cancel(); localStorage.setItem('nandolino_voice_muted', '1'); }
  updateVoiceButton();
});
updateVoiceButton();

/* Voz: falar com o Nandolino (Speech-to-Text) */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognitionAPI) {
  const recognition = new SpeechRecognitionAPI();
  recognition.lang = 'pt-BR'; recognition.interimResults = false; recognition.maxAlternatives = 1;
  recognition.onstart = () => micBtn.classList.add('recording');
  recognition.onend = () => micBtn.classList.remove('recording');
  recognition.onerror = () => micBtn.classList.remove('recording');
  recognition.onresult = event => { input.value = event.results[0][0].transcript; ask(); };
  micBtn.addEventListener('click', () => { unlockVoice(); micBtn.classList.contains('recording') ? recognition.stop() : recognition.start(); });
} else micBtn.style.display = 'none';

sendBtn.addEventListener('click', () => ask());
input.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
renderQuickActions();
setAIStatus(NANDOLINO_AI.endpoint ? 'local' : 'local', NANDOLINO_AI.endpoint ? 'IA local configurada • pronta para responder' : 'modo local • IA externa não configurada');
addMessage('Oi! Eu sou o Nandolino 👋 Vou te guiar pelo portfólio do Fernando. Posso mostrar o que ele faz, os projetos, as tecnologias ou te ajudar a entrar em contato. Quando a IA local estiver ligada, eu também respondo perguntas livres.', 'bot');
</script>
